services:
  # Unser Angular Frontend
  frontend:
    build: .
    ports:
      - "8080:80" # Erreichbar unter http://DEIN-SERVER:8080
    depends_on:
      - backend
    restart: always

  # Unser JSON Server Backend
  # ... frontend bleibt gleich ...

  backend:
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: pocketbase
    restart: unless-stopped
    # Wir speichern die Daten dauerhaft im Ordner pb_data
    volumes:
      - ./pb_data:/pb_data
    # PocketBase läuft standardmäßig auf 8090
    ports:
      - "8090:8090"
    # Optional: Healthcheck
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8090/api/health"]
      interval: 5s
      timeout: 5s
      retries: 5
