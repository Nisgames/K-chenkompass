server {
    listen 80;

    # 1. Frontend (bleibt gleich)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. Backend (Neu für PocketBase)
    location /api/ {
        # WICHTIG: Kein Rewrite mehr, einfach durchreichen!
        proxy_pass http://backend:8090;

        # Diese Header sind wichtig für PocketBase (Auth & Realtime)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Admin-Bereich (Optional, damit du später auch auf dem Server an die DB kommst)
    # PocketBase Admin liegt unter /_/. Wir leiten das auch weiter.
    location /_/ {
        proxy_pass http://backend:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
