<div class="editor-container">
  <h2>Neues Rezept erstellen</h2>

  <form [formGroup]="recipeForm" (ngSubmit)="onSubmit()">

    <div class="form-group">
      <label>Titel des Rezepts *</label>
      <input type="text" formControlName="title" placeholder="z.B. Pfannkuchen">
    </div>

    <div class="form-group">
      <label>Bild URL</label>
      <input type="text" formControlName="imageUrl" placeholder="http://...">
    </div>

    <div class="row">
      <div class="form-group">
        <label>Dauer (Min)</label>
        <input type="number" formControlName="durationMinutes">
      </div>

      <div class="form-group">
        <label>Portionen</label>
        <input type="number" formControlName="servings">
      </div>
    </div>

    <div class="form-group">
      <label>Kategorie</label>
      <select formControlName="category">
        <option value="Herzhaft">Herzhaft</option>
        <option value="Süß">Süß</option>
      </select>
    </div>

    <hr> <div formArrayName="ingredients">
    <h3>Zutaten</h3>

    @for (ctrl of ingredients.controls; track $index; let i = $index) {
      <div [formGroupName]="i" class="ingredient-row">

        <input type="number" formControlName="amount" placeholder="Menge" class="small-input">
        <input type="text" formControlName="unit" placeholder="Einh." class="small-input">
        <input type="text" formControlName="name" placeholder="Zutat (z.B. Mehl)" class="wide-input">

        <button type="button" (click)="removeIngredient(i)" class="delete-btn">🗑</button>
      </div>
    }

    <button type="button" (click)="addIngredient()" class="add-btn">+ Zutat hinzufügen</button>
  </div>

    <hr>

    <div formArrayName="steps">
      <h3>Zubereitung</h3>

      @for (ctrl of steps.controls; track $index; let i = $index) {
        <div class="step-row">
          <span class="step-number">{{ i + 1 }}.</span>

          <textarea [formControlName]="i" rows="2" placeholder="Was ist zu tun?"></textarea>

          <button type="button" (click)="removeStep(i)" class="delete-btn">🗑</button>
        </div>
      }

      <button type="button" (click)="addStep()" class="add-btn">+ Schritt hinzufügen</button>
    </div>

    <hr>

    <button type="submit" [disabled]="!recipeForm.valid" class="save-btn">
      Rezept Speichern
    </button>

  </form>
</div>
