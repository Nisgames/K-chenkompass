<div class="control-bar glass-panel">

  <div class="search-wrapper">
    <span class="search-icon">🔍</span>
    <input
      type="text"
      placeholder="Was möchtest du kochen?"
      (input)="onSearch($event)"
    >
  </div>

  <div class="filter-wrapper">
    <button (click)="filterByCategory('Alle')"
            [class.active]="selectedCategory === 'Alle'">Alle</button>

    <button (click)="filterByCategory('Herzhaft')"
            [class.active]="selectedCategory === 'Herzhaft'">Herzhaft</button>

    <button (click)="filterByCategory('Süß')"
            [class.active]="selectedCategory === 'Süß'">Süß</button>
  </div>

  <button routerLink="/recipe/new" class="create-btn">
    + Neues Rezept
  </button>

</div>

<div class="recipe-grid">
  @for (recipe of recipes; track recipe.id) {
    <div class="recipe-card" [routerLink]="['/recipe', recipe.id]">

      <div class="card-image"
           [style.background-image]="'url(' + (recipe.imageUrl ? recipe.imageUrl : 'assets/images/placeholder-recipe.jpg') + ')'">
      </div>

      <div class="card-content">
        <h3>{{ recipe.title }}</h3>

        <div class="meta-info">
          <span class="category-badge">{{ recipe.category }}</span>
          <span class="duration">⏱ {{ recipe.durationMinutes }} Min.</span>
        </div>
      </div>
    </div>
  } @empty {
    <div class="empty-state glass-panel">
      <p>Keine Rezepte gefunden. 😔</p>
      <button (click)="filterByCategory('Alle')">Filter zurücksetzen</button>
    </div>
  }
</div>
