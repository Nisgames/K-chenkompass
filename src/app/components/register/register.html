<div class="login-container">
  <div class="login-card glass-panel">
    <h1>Konto erstellen 🚀</h1>
    <p class="subtitle">Werde Teil der KochKompass Community!</p>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Benutzername</label>
        <input type="text" formControlName="username" placeholder="Chefkoch2000">
      </div>

      <div class="form-group">
        <label>E-Mail Adresse</label>
        <input type="email" formControlName="email" placeholder="neu@hier.de">
      </div>

      <div class="form-group">
        <label>Passwort (min 8 Zeichen)</label>
        <input type="password" formControlName="password" placeholder="••••••••">
      </div>

      <div class="form-group">
        <label>Passwort bestätigen</label>
        <input type="password" formControlName="passwordConfirm" placeholder="••••••••">
      </div>

      @if (errorMessage) {
        <div class="error-msg">{{ errorMessage }}</div>
      }

      <button type="submit" [disabled]="registerForm.invalid || isLoading" class="login-btn">
        {{ isLoading ? 'Erstelle...' : 'Kostenlos registrieren ✨' }}
      </button>

    </form>

    <div class="footer-links">
      <a routerLink="/login" class="back-link">Bereits ein Konto? Zum Login</a>
    </div>
  </div>
</div>
